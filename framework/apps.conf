# hostd app registry. One repo path per line.
#
# This is the canonical copy; `hostd install` copies it to
# ~/.local/etc/hostd/apps.conf, because bash cannot read anything under
# ~/Documents when launchd starts it.
#
# A path is all that is recorded. Name, branch, health target, build timeout
# and backup jobs are read from that repo's own deploy.yml at HEAD, so an app
# changes its own hosting facts by committing to itself. See SPEC.md.
#
# Add with `hostd add <path>`, remove with `hostd rm <name>`.

