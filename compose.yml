# The backupd stack. One app among the several hostd hosts on this box; the
# framework itself lives in framework/ and is not part of this compose project.
name: backupd

services:
  backupd:
    build: .
    restart: always
    volumes:
      # >>> hostd:mounts
      - odyssey-data:/sources/odyssey:ro
      - draw-data:/sources/draw:ro
      # <<< hostd:mounts
      - ./jobs.yml:/etc/backupd/jobs.yml:ro
    environment:
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}

volumes:
  # >>> hostd:volumes
  odyssey-data:
    external: true
    name: odyssey-data
  draw-data:
    external: true
    name: draw-data
  # <<< hostd:volumes
