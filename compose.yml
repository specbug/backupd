# The backupd stack. One app among the several hostd hosts on this box; the
# framework itself lives in framework/ and is not part of this compose project.
name: backupd

services:
  backupd:
    build: .
    restart: always
    volumes:
      # >>> hostd:mounts
      # Generated by `hostd sync` from the `backup.volume` of every registered
      # app's deploy.yml. Do not edit by hand; edit the app's manifest.
      # <<< hostd:mounts
      - ./jobs.yml:/etc/backupd/jobs.yml:ro
    environment:
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}

volumes:
  # >>> hostd:volumes
  # Generated by `hostd sync`. Each is external and globally named, so the
  # producing stack must set `name: <volume>` on its own declaration for
  # Podman to skip the project prefix.
  # <<< hostd:volumes
