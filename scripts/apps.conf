# App registry for deployd. One whitespace-separated line per compose stack:
#
#   <name>  <repo path>  <branch>
#
# <name> must match the app's watchdog label suffix (in.sixeleven.<name>),
# because deployd takes /tmp/in.sixeleven.<name>.lock before rebuilding so
# the watchdog can't run `compose up` mid-build.
#
# The repo must be a git clone whose `origin` is reachable non-interactively
# (no ssh-agent in launchd) and whose root holds the compose file.

