# App registry for deployd. This file is the canonical copy; the runtime one
# is ~/.local/etc/deployd.conf, because bash cannot read ~/Documents under
# launchd. Re-copy after editing:
#
#     cp scripts/apps.conf ~/.local/etc/deployd.conf
#
# One whitespace-separated line per compose stack:
#
#   <name>  <repo path>  <branch>
#
# <name> must match the app's watchdog label suffix (in.sixeleven.<name>),
# because deployd takes /tmp/in.sixeleven.<name>.lock before rebuilding so
# the watchdog can't run `compose up` mid-build.
#
# The repo must be a git clone whose `origin` is reachable non-interactively
# (no ssh-agent in launchd) and whose root holds the compose file.

odyssey  /Users/rishitv/Documents/odyssey  main
backupd  /Users/rishitv/Documents/backupd  main
